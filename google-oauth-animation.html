<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentFlow — OAuth Flow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#1d1d1f;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}

  .shell{display:flex;height:100vh}

  /* ── Sidebar ────────────────────── */
  .side{width:250px;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;flex-shrink:0;background:#fafafa}
  .side-head{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid #e8e8e8}
  .side-head h1{font-size:0.95rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:2px}
  .side-head .tag{font-size:0.58rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#999}

  .side-steps{flex:1;overflow-y:auto;padding:0.5rem 0}
  .ss{display:flex;align-items:flex-start;gap:0.65rem;padding:0.6rem 1.25rem;cursor:pointer;transition:all 0.15s;border-left:3px solid transparent}
  .ss:hover{background:#f0f0f0}
  .ss.now{background:#f5f7ff;border-left-color:#2563eb}
  .ss.past{border-left-color:#d0d0d0}
  .sn{width:22px;height:22px;border-radius:6px;border:1.5px solid #ddd;font-family:'Fira Code',monospace;font-size:0.65rem;font-weight:600;color:#bbb;display:grid;place-items:center;flex-shrink:0;margin-top:1px;transition:all 0.2s}
  .ss.now .sn{border-color:#2563eb;color:#fff;background:#2563eb}
  .ss.past .sn{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
  .st-text{font-size:0.74rem;color:#888;line-height:1.4}
  .ss.now .st-text{color:#1d1d1f;font-weight:600}
  .ss.past .st-text{color:#666}

  .side-foot{padding:0.75rem 1rem;border-top:1px solid #e8e8e8;display:flex;gap:0.35rem;flex-wrap:wrap}
  .sb{height:30px;padding:0 14px;border-radius:7px;border:1px solid #ddd;background:#fff;font-family:inherit;font-size:0.72rem;font-weight:500;color:#666;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all 0.12s}
  .sb:hover{border-color:#aaa;color:#333}
  .sb.pri{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
  .sb.pri:hover{background:#333}

  /* ── Main ────────────────────────── */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}

  /* ── Actor bar (sticky top) ─────── */
  .actor-bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e8e8e8;padding:1.25rem 2rem 0}
  .actors{display:grid;grid-template-columns:1fr 1fr 1fr;max-width:820px;margin:0 auto}
  .actor{text-align:center;padding-bottom:1rem}
  .a-box{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:10px;border:2px solid #e8e8e8;background:#fff;transition:all 0.3s}
  .actor.on .a-box{border-color:#2563eb;background:#f5f7ff}
  .a-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  .a-icon svg{width:18px;height:18px}
  .a-name{font-size:0.82rem;font-weight:600}
  .a-sub{font-family:'Fira Code',monospace;font-size:0.6rem;color:#aaa;margin-top:3px}

  /* ── Sequence diagram ───────────── */
  .seq{flex:1;overflow-y:auto;padding:0 0 2rem}
  .seq-inner{max-width:820px;margin:0 auto;position:relative;padding:0 3rem}

  /* Lifelines */
  .ll{position:absolute;top:0;bottom:0;width:2px;background:#d8d8d8;z-index:0}
  .ll-1{left:16.66%}.ll-2{left:50%}.ll-3{left:83.33%}

  /* Message row */
  .m{position:relative;padding:1.75rem 0;border-bottom:1px solid #eee;z-index:1;transition:all 0.35s ease}

  /* States */
  .m.future{opacity:0.08}
  .m.past{}
  .m.now{background:#f0f4ff;margin:0 -1rem;padding:1.75rem 1rem;border-radius:10px;border-bottom:none}

  /* Step number */
  .m-step{position:absolute;left:-2.5rem;top:1.75rem;width:26px;height:26px;border-radius:7px;font-family:'Fira Code',monospace;font-size:0.72rem;font-weight:700;display:grid;place-items:center;transition:all 0.2s}
  .m.future .m-step{background:#f0f0f0;color:#ccc}
  .m.past .m-step{background:#1d1d1f;color:#fff}
  .m.now .m-step{background:#2563eb;color:#fff;transform:scale(1.15);box-shadow:0 2px 8px rgba(37,99,235,0.3)}

  /* Arrow label */
  .m-label{font-size:0.82rem;font-weight:500;color:#555;line-height:1.45;margin-bottom:7px;transition:all 0.2s}
  .m.future .m-label{color:#ccc}
  .m.past .m-label{color:#555}
  .m.now .m-label{color:#1d1d1f;font-weight:600;font-size:0.85rem}
  .m.now .m-label.s2s-l{color:#2563eb}

  /* Sub-label (sends/receives) */
  .m-sub{font-size:0.7rem;color:#999;line-height:1.4;margin-bottom:5px;font-style:italic;transition:all 0.2s}
  .m.future .m-sub{color:#ddd}
  .m.past .m-sub{color:#999}
  .m.now .m-sub{color:#666}

  /* Method tags */
  .mtag{font-family:'Fira Code',monospace;font-size:0.68rem;font-weight:600;display:inline-block;padding:2px 8px;border-radius:4px;margin-right:6px;vertical-align:1px}
  .mtag-get{background:#eff6ff;color:#2563eb}
  .mtag-post{background:#f0fdf4;color:#16a34a}
  .mtag-302{background:#fef9ee;color:#b45309}
  .m.future .mtag{background:#f5f5f5;color:#ccc}
  .m.past .mtag-get{background:#f0f4ff;color:#5b8fe8}
  .m.past .mtag-post{background:#f0faf4;color:#5bba82}
  .m.past .mtag-302{background:#fdf6ed;color:#c9943a}

  /* Arrow line */
  .m-arrow{position:relative;height:2.5px;background:#999;border-radius:1px;transition:all 0.2s}
  .m.future .m-arrow{background:#e0e0e0}
  .m.past .m-arrow{background:#aaa}
  .m.now .m-arrow{background:#2563eb;height:3px}
  .m.now .m-arrow.s2s{background:#2563eb}

  .m-arrow.dashed{background:repeating-linear-gradient(90deg,#999 0 6px,transparent 6px 11px)}
  .m.future .m-arrow.dashed{background:repeating-linear-gradient(90deg,#e0e0e0 0 6px,transparent 6px 11px)}
  .m.past .m-arrow.dashed{background:repeating-linear-gradient(90deg,#aaa 0 6px,transparent 6px 11px)}
  .m.now .m-arrow.dashed{background:repeating-linear-gradient(90deg,#2563eb 0 6px,transparent 6px 11px)}

  /* Arrowhead — bigger */
  .m-arrow::after{content:'';position:absolute;top:-6px;border-top:7.5px solid transparent;border-bottom:7.5px solid transparent}
  .m-arrow.right::after{right:-2px;border-left:12px solid #999}
  .m-arrow.left::after{left:-2px;border-right:12px solid #999}
  .m.future .m-arrow.right::after{border-left-color:#e0e0e0}
  .m.future .m-arrow.left::after{border-right-color:#e0e0e0}
  .m.past .m-arrow.right::after{border-left-color:#aaa}
  .m.past .m-arrow.left::after{border-right-color:#aaa}
  .m.now .m-arrow.right::after{border-left-color:#2563eb}
  .m.now .m-arrow.left::after{border-right-color:#2563eb}

  /* Arrow draw animation */
  .m-arrow{transform-origin:left;transform:scaleX(1);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1),opacity 0.3s,background 0.2s}
  .m-arrow.left{transform-origin:right}
  .m.just-entered .m-arrow{animation:drawArrow 0.6s cubic-bezier(0.16,1,0.3,1) forwards}
  @keyframes drawArrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .m.just-entered .m-arrow::after{animation:fadeHead 0.3s 0.4s ease forwards;opacity:0}
  @keyframes fadeHead{to{opacity:1}}
  .m.just-entered .m-label{animation:fadeLabel 0.3s 0.2s ease forwards;opacity:0}
  @keyframes fadeLabel{to{opacity:1}}
  .m.just-entered .m-step{animation:popNum 0.3s 0.1s cubic-bezier(0.16,1,0.3,1) forwards;opacity:0;transform:scale(0.7)}
  @keyframes popNum{to{opacity:1;transform:scale(1.15)}}

  /* S2S band */
  .m.s2s-row{border-left:3px solid transparent}
  .m.s2s-row.past{background:#f8faff;border-left-color:#dbe5f7}
  .m.s2s-row.now{background:#edf2ff;border-left-color:#2563eb}
  .s2s-badge{position:absolute;top:0.5rem;right:0.5rem;font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:2px 8px;border-radius:4px;transition:all 0.2s}
  .m.now .s2s-badge{color:#2563eb;background:#dbeafe}
  .m.future .s2s-badge{color:#ddd;background:transparent}
  .m.past .s2s-badge{color:#7da4e0;background:#eef3fd}

  /* ── Detail panel ───────────────── */
  .detail-wrap{border-top:1px solid #e8e8e8;max-height:0;overflow-y:auto;transition:max-height 0.4s cubic-bezier(0.16,1,0.3,1)}
  .detail-wrap.open{max-height:50vh}

  .detail{max-width:820px;margin:0 auto;padding:1.5rem 3rem 2rem}
  .d-head{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.6rem}
  .d-n{width:26px;height:26px;border-radius:7px;background:#2563eb;color:#fff;font-family:'Fira Code',monospace;font-size:0.72rem;font-weight:700;display:grid;place-items:center;flex-shrink:0}
  .d-title{font-size:0.95rem;font-weight:700;letter-spacing:-0.01em}

  .d-tags{display:flex;gap:0.3rem;margin-bottom:1rem;flex-wrap:wrap}
  .d-tag{font-size:0.6rem;font-weight:600;padding:3px 9px;border-radius:5px;background:#f0f0f0;color:#777}
  .d-tag.blue{background:#eff6ff;color:#2563eb}
  .d-tag.green{background:#f0fdf4;color:#16a34a}
  .d-tag.orange{background:#fef9ee;color:#b45309}

  .detail p{font-size:0.86rem;color:#555;line-height:1.75;margin-bottom:0.55rem}
  .detail p strong{color:#1d1d1f}
  .detail code{font-family:'Fira Code',monospace;font-size:0.78rem;background:#f5f5f5;padding:2px 6px;border-radius:4px}

  .cb{background:#f8f8f8;border:1px solid #eee;border-radius:8px;padding:0.85rem 1.1rem;font-family:'Fira Code',monospace;font-size:0.72rem;line-height:1.85;color:#444;overflow-x:auto;margin:0.55rem 0}
  .cb .k{color:#8250df;font-weight:500}
  .cb .s{color:#0a7e32}
  .cb .u{color:#0969da}
  .cb .v{color:#cf222e}
  .cb .c{color:#aaa}

  .note{display:flex;gap:0.6rem;padding:0.7rem 0.85rem;border-radius:7px;font-size:0.8rem;line-height:1.65;margin-top:0.55rem;align-items:flex-start}
  .note strong{color:inherit}
  .note.warn{background:#fef2f2;border-left:3px solid #ef4444;color:#7f1d1d}
  .note.ok{background:#f0fdf4;border-left:3px solid #22c55e;color:#14532d}

  @media(max-width:900px){.side{display:none}.seq-inner{padding:0 1.5rem}.detail{padding:1.25rem 1.5rem}.actor-bar{padding:1rem 1rem 0}}
</style>
</head>
<body>
<div class="shell">

  <div class="side">
    <div class="side-head">
      <h1>Authorization Code Flow</h1>
      <span class="tag">OAuth 2.0 / OIDC</span>
    </div>
    <div class="side-steps" id="sideSteps"></div>
    <div class="side-foot">
      <button class="sb" onclick="prev()">&#8592; Prev</button>
      <button class="sb pri" onclick="next()">Next &#8594;</button>
      <button class="sb" onclick="auto()" id="autoBtn">Play</button>
      <button class="sb" onclick="reset()">Reset</button>
    </div>
  </div>

  <div class="main">
    <div class="seq" id="seq">
      <div class="actor-bar">
        <div class="actors">
          <div class="actor" id="a0">
            <div class="a-box">
              <div class="a-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
              <span class="a-name">Your Browser</span>
            </div>
            <div class="a-sub">User's device</div>
          </div>
          <div class="actor" id="a1">
            <div class="a-box">
              <div class="a-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
              <span class="a-name">AgentFlow</span>
            </div>
            <div class="a-sub">localhost:8000</div>
          </div>
          <div class="actor" id="a2">
            <div class="a-box">
              <div class="a-icon"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></div>
              <span class="a-name">Google OAuth</span>
            </div>
            <div class="a-sub">accounts.google.com</div>
          </div>
        </div>
      </div>

      <div class="seq-inner">
        <div class="ll ll-1"></div><div class="ll ll-2"></div><div class="ll ll-3"></div>
        <div id="msgs"></div>
      </div>
    </div>

    <div class="detail-wrap" id="detailWrap">
      <div class="detail" id="detail"></div>
    </div>
  </div>
</div>

<script>
const L=[16.66,50,83.33];

const S=[
  {f:0,t:1,mt:"GET",mtc:"get",
   lbl:"/auth/google/login",
   sub:"Sends: nothing (just a redirect to own backend)",
   title:"User clicks login button",
   tags:[{t:"Browser"},{t:"AgentFlow"}],
   html:`<p>The user clicks <strong>"Login with Google"</strong> on the frontend. The browser navigates to AgentFlow's login endpoint.</p>
   <div class="cb"><span class="c">// Frontend button click</span><br><span class="k">window.location.href</span> = <span class="s">"http://localhost:8000/auth/google/login"</span></div>
   <p>No credentials, no tokens. Just a simple redirect to start the flow.</p>`},

  {f:1,t:2,mt:"302",mtc:"302",
   lbl:"Redirect browser to Google's login page",
   sub:"Sends: client_id, redirect_uri, scope, state",
   title:"AgentFlow redirects to Google",
   tags:[{t:"AgentFlow"},{t:"Google OAuth"}],
   html:`<p>AgentFlow generates a random <strong>state</strong> for CSRF protection, builds the Google authorization URL, and sends a 302 redirect.</p>
   <div class="cb"><span class="u">accounts.google.com/o/oauth2/v2/auth</span><br>  ?<span class="k">client_id</span>=<span class="v">123-abc.apps.googleusercontent.com</span><br>  &<span class="k">redirect_uri</span>=<span class="s">http://localhost:8000/auth/callback</span><br>  &<span class="k">scope</span>=<span class="s">openid email profile</span><br>  &<span class="k">state</span>=<span class="v">a1b2c3d4</span> <span class="c">&larr; random, verified later</span></div>
   <div class="note warn"><strong>state</strong> prevents CSRF attacks. AgentFlow stores it and verifies it matches when Google redirects back.</div>`},

  {f:0,t:2,mt:null,
   lbl:"User enters their Google email and password",
   sub:"Password goes to Google only. AgentFlow never sees it.",
   title:"User authenticates at Google",
   tags:[{t:"Browser"},{t:"Google OAuth"}],
   html:`<p>The browser is at <strong>accounts.google.com</strong>. The user enters their Google credentials. The password is sent to Google's servers only.</p>
   <div class="note ok"><strong>AgentFlow never sees the password.</strong> The login form is on Google's domain. AgentFlow's server is not involved in this step at all.</div>
   <p>Google also verifies that <code>redirect_uri</code> matches what's registered in the Console. If it doesn't match exactly &rarr; <code>redirect_uri_mismatch</code> error.</p>`},

  {f:2,t:1,mt:"302",mtc:"302",
   lbl:"Redirect back to AgentFlow's callback",
   sub:"Sends: authorization code + state parameter",
   title:"Google sends authorization code",
   tags:[{t:"Google OAuth"},{t:"AgentFlow"}],
   html:`<p>After successful login, Google redirects the browser to AgentFlow's callback URL with a one-time <strong>authorization code</strong>.</p>
   <div class="cb"><span class="u">localhost:8000/auth/callback</span><br>  ?<span class="k">code</span>=<span class="v">4/0AeanS0a7Bx...long-string</span> <span class="c">&larr; one-time use, expires in 5 min</span><br>  &<span class="k">state</span>=<span class="v">a1b2c3d4</span> <span class="c">&larr; AgentFlow verifies this matches</span></div>
   <div class="note warn">The code is <strong>useless alone</strong>. Exchanging it for tokens requires the <strong>client_secret</strong> which only exists in AgentFlow's <code>.env</code> file on the server.</div>`},

  {f:1,t:2,mt:"POST",mtc:"post",s2s:true,
   lbl:"Exchange authorization code for tokens",
   sub:"Sends: code + client_secret. Receives: access_token + id_token",
   title:"AgentFlow exchanges code for tokens",
   tags:[{t:"AgentFlow"},{t:"Google OAuth"},{t:"Server-to-server",c:"blue"}],
   html:`<p>AgentFlow's server sends the code plus its secret directly to Google. <strong>The browser is not involved</strong> in this step.</p>
   <p><strong>What AgentFlow sends:</strong></p>
   <div class="cb"><span class="k">POST</span> <span class="u">oauth2.googleapis.com/token</span><br><br>  <span class="k">code</span> = <span class="v">4/0AeanS0a7Bx...</span> <span class="c">&larr; from step 4</span><br>  <span class="k">client_id</span> = <span class="v">123-abc.apps...</span><br>  <span class="k">client_secret</span> = <span class="v">GOCSPX-xyz123</span> <span class="c">&larr; from .env, never in browser</span><br>  <span class="k">grant_type</span> = <span class="s">authorization_code</span></div>
   <p><strong>What Google sends back:</strong></p>
   <div class="cb">{ <span class="k">"access_token"</span>: <span class="s">"ya29.a0ARrdaM..."</span>, <span class="c">&larr; key to call Google APIs</span><br>  <span class="k">"id_token"</span>: <span class="s">"eyJhbGciOi..."</span>, <span class="c">&larr; JWT with user identity</span><br>  <span class="k">"expires_in"</span>: <span class="v">3599</span> <span class="c">&larr; token valid for 1 hour</span> }</div>
   <div class="note warn">These tokens <strong>stay on the server</strong>. They are never sent to the browser. The browser only gets a session cookie in step 7.</div>`},

  {f:1,t:2,mt:"GET",mtc:"get",s2s:true,dashed:true,
   lbl:"Fetch user's verified identity",
   sub:"Sends: access_token. Receives: email, name, picture",
   title:"AgentFlow fetches verified identity",
   tags:[{t:"AgentFlow"},{t:"Google OAuth"},{t:"Server-to-server",c:"blue"}],
   html:`<p>Using the access_token from step 5, AgentFlow asks Google: <strong>"Who is this person?"</strong></p>
   <p><strong>What AgentFlow sends:</strong></p>
   <div class="cb"><span class="k">GET</span> <span class="u">openidconnect.googleapis.com/v1/userinfo</span><br><span class="k">Authorization:</span> <span class="s">Bearer ya29.a0ARrdaM...</span></div>
   <p><strong>What Google sends back:</strong></p>
   <div class="cb">{ <span class="k">"email"</span>: <span class="s">"priya.sharma@gmail.com"</span>, <span class="c">&larr; verified by Google</span><br>  <span class="k">"name"</span>: <span class="s">"Priya Sharma"</span>,<br>  <span class="k">"picture"</span>: <span class="s">"https://lh3.googleusercontent.com/a/..."</span>,<br>  <span class="k">"email_verified"</span>: <span class="v">true</span> }</div>
   <div class="note ok">This email is <strong>verified by Google</strong>. No one typed it in a form. No one can impersonate another user's email.</div>`},

  {f:1,t:0,mt:"302",mtc:"302",
   lbl:"Redirect to frontend with session cookie",
   sub:"Sends: Set-Cookie header with session_token. User is now logged in.",
   title:"Session created, user logged in",
   tags:[{t:"AgentFlow"},{t:"Browser"},{t:"Same as Phase 1",c:"green"}],
   html:`<p>AgentFlow creates or finds the user in the database, generates a session token, sets it as an HttpOnly cookie, and redirects to the frontend.</p>
   <p><strong>What AgentFlow does (identical to Phase 1):</strong></p>
   <div class="cb"><span class="c"># This code is character-for-character identical to Phase 1</span><br><br>token = <span class="k">secrets.token_hex</span>(<span class="v">32</span>) <span class="c">&larr; random 64-char session token</span><br>session = <span class="k">SessionRecord</span>(session_token=token, user_id=user.id)<br>db.add(session) <span class="c">&larr; stored in sessions table</span><br><br>response.<span class="k">set_cookie</span>(<span class="s">"session_token"</span>, token, <span class="k">httponly</span>=<span class="v">True</span>) <span class="c">&larr; browser gets this</span></div>
   <p><strong>What the browser receives:</strong></p>
   <div class="cb"><span class="k">HTTP/1.1 302 Found</span><br><span class="k">Location:</span> <span class="u">http://localhost:5173</span><br><span class="k">Set-Cookie:</span> <span class="s">session_token=7f8e9a2b...; HttpOnly; SameSite=Lax</span></div>
   <div class="note ok"><strong>From here on, everything is Phase 1.</strong> Cookie on every request, session lookup in the database, get_current_user() gatekeeper, logout. The only thing that changed was how the email was verified.</div>`},
];

let cur=-1,tmr=null,lastDir=1;

// Sidebar
const sideEl=document.getElementById('sideSteps');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='ss';
  d.innerHTML=`<div class="sn">${i+1}</div><div class="st-text">${s.title}</div>`;
  d.onclick=()=>goTo(i);
  sideEl.appendChild(d);
});

// Build all message rows
const msgsEl=document.getElementById('msgs');
S.forEach((s,i)=>{
  const row=document.createElement('div');
  row.className='m future'+(s.s2s?' s2s-row':'');
  row.id='m'+i;

  // Step number
  const step=document.createElement('div');
  step.className='m-step';
  step.textContent=i+1;
  row.appendChild(step);

  // S2S badge
  if(s.s2s){
    const b=document.createElement('div');
    b.className='s2s-badge';
    b.textContent='SERVER-TO-SERVER';
    row.appendChild(b);
  }

  const goRight=s.t>s.f;
  const leftPct=L[Math.min(s.f,s.t)]+1;
  const rightPct=100-L[Math.max(s.f,s.t)]+1;

  // Label
  const lbl=document.createElement('div');
  lbl.className='m-label'+(s.s2s?' s2s-l':'');
  lbl.style.marginLeft=leftPct+'%';lbl.style.marginRight=rightPct+'%';
  const mtagHtml=s.mt?`<span class="mtag mtag-${s.mtc}">${s.mt}</span>`:'';
  lbl.innerHTML=mtagHtml+s.lbl;
  row.appendChild(lbl);

  // Sub-label (sends/receives)
  if(s.sub){
    const sub=document.createElement('div');
    sub.className='m-sub';
    sub.style.marginLeft=leftPct+'%';sub.style.marginRight=rightPct+'%';
    sub.textContent=s.sub;
    row.appendChild(sub);
  }

  // Arrow
  const arr=document.createElement('div');
  arr.className='m-arrow'+(goRight?' right':' left')+(s.dashed?' dashed':'')+(s.s2s?' s2s':'');
  arr.style.marginLeft=leftPct+'%';arr.style.marginRight=rightPct+'%';
  row.appendChild(arr);

  msgsEl.appendChild(row);
});

function render(){
  // Sidebar
  document.querySelectorAll('.ss').forEach((el,i)=>{
    el.className='ss'+(i===cur?' now':'')+(i<cur?' past':'');
  });

  // Messages
  S.forEach((_,i)=>{
    const el=document.getElementById('m'+i);
    const wasNow=el.classList.contains('now');
    const base='m'+(S[i].s2s?' s2s-row':'');
    if(i===cur){
      el.className=base+' now'+(lastDir>0&&!wasNow?' just-entered':'');
      // Remove animation class after it plays
      if(!wasNow)setTimeout(()=>el.classList.remove('just-entered'),700);
    }else if(i<cur){
      el.className=base+' past';
    }else{
      el.className=base+' future';
    }
  });

  // Actors
  document.querySelectorAll('.actor').forEach(a=>a.classList.remove('on'));
  if(cur>=0){
    document.getElementById('a'+S[cur].f).classList.add('on');
    document.getElementById('a'+S[cur].t).classList.add('on');
  }

  // Scroll to current
  if(cur>=0){
    document.getElementById('m'+cur).scrollIntoView({behavior:'smooth',block:'center'});
  }

  // Detail
  const wrap=document.getElementById('detailWrap');
  const det=document.getElementById('detail');
  if(cur<0){wrap.className='detail-wrap';det.innerHTML='';return}

  wrap.className='detail-wrap open';
  const s=S[cur];
  const tagHtml=s.tags.map(t=>`<span class="d-tag${t.c?' '+t.c:''}">${t.t}</span>`).join('');
  det.innerHTML=`<div class="d-head"><div class="d-n">${cur+1}</div><div class="d-title">${s.title}</div></div><div class="d-tags">${tagHtml}</div>${s.html}`;
}

function next(){if(cur<S.length-1){lastDir=1;cur++;render()}}
function prev(){if(cur>0){lastDir=-1;cur--;render()}}
function goTo(i){lastDir=i>cur?1:-1;cur=i;render()}
function reset(){stopA();cur=-1;render()}
function stopA(){if(tmr){clearInterval(tmr);tmr=null;document.getElementById('autoBtn').textContent='Play'}}
function auto(){if(tmr){stopA();return}reset();document.getElementById('autoBtn').textContent='Stop';let i=0;tmr=setInterval(()=>{if(i>=S.length){stopA();return}lastDir=1;cur=i++;render()},3500)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}if(e.key==='r'||e.key==='R')reset()});
</script>
</body>
</html>
